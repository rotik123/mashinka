<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CSS Машинка</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 12% 18%, #ffeb3b 0 40px, rgba(255, 235, 59, 0.3) 41px 65px, transparent 66px),
        repeating-linear-gradient(90deg, #fff 0 45px, transparent 45px 90px) 0 calc(70vh + 42px) / 100% 6px no-repeat,
        linear-gradient(to bottom, #455a64 0, #37474f 100%) 0 70vh / 100% 30vh no-repeat,
        linear-gradient(to bottom, #81d4fa, #e1f5fe);
    }

    .car {
      position: absolute;
      top: calc(70vh - 50px);
      width: 200px;
      height: 75px;

      background:
        radial-gradient(circle, #fff9c4 0 5px, #fbc02d 6px, transparent 7px) 193px 40px / 14px 14px no-repeat,
        linear-gradient(#d32f2f, #d32f2f) 0 38px / 6px 12px no-repeat,
        linear-gradient(115deg, #263238 72%, transparent 73%) 45px 8px / 48px 25px no-repeat,
        linear-gradient(65deg, transparent 27%, #263238 28%) 98px 8px / 52px 25px no-repeat,
        linear-gradient(115deg, transparent 18%, #e53935 19%) 35px 2px / 65px 33px no-repeat,
        linear-gradient(65deg, #e53935 81%, transparent 82%) 98px 2px / 62px 33px no-repeat,
        linear-gradient(to bottom, #f44336 0 65%, #c62828 65% 100%) 0 33px / 200px 30px no-repeat;

      border-radius: 15px 25px 8px 8px;

      animation: drive 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .car::before,
    .car::after {
      content: "";
      position: absolute;
      bottom: -2px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #37474f 0 4px, #cfd8dc 5px 11px, #212121 12px 19px);
      border: 2px dashed #546e7a;
      animation: spin 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .car::before {
      left: 26px;
    }

    .car::after {
      right: 26px;
    }

    @keyframes drive {
      0% {
        left: -210px;
      }
      100% {
        left: calc(100vw - 250px);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(1080deg);
      }
    }
  </style>
</head>
<body>

  <div class="car"></div>

</body>
</html>
